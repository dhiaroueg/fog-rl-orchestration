# Niveau N2 : recompense complete (energie + cout), trafic en pics.
# Duree indicative : voir wall_time_s dans models/n2/<algo>/seed<k>/contract.json (ENF-05 : < 6 h par run sur CPU).
level: n2
env: configs/env/n2.yaml
total_timesteps: 400000
n_envs: 8                    # environnements paralleles (cahier, Phase 3 etape 1)
vec_env: dummy               # "subproc" pour un vrai parallelisme multi-coeurs
# Observation deja normalisee dans [0, 1] par state_spec : seule la recompense est normalisee.
normalize: {obs: false, reward: true}
eval:
  freq: 33333                  # evaluation periodique (graine fixe >= 1000)
  episodes: 5
  seed_start: 1000
  n_requests: 2000
algos:
  ppo:
    n_steps: 256
    batch_size: 256
    n_epochs: 10
    learning_rate: 3.0e-4
    gamma: 0.99
    gae_lambda: 0.95
    ent_coef: 0.01
    clip_range: 0.2
    net_arch: [64, 64]
  a2c:
    n_steps: 16
    learning_rate: 7.0e-4
    gamma: 0.99
    ent_coef: 0.01
    vf_coef: 0.5
    net_arch: [64, 64]
  dqn:
    n_envs: 4
    learning_rate: 1.0e-3
    buffer_size: 100000
    learning_starts: 2000
    batch_size: 128
    gamma: 0.99
    train_freq: 4
    gradient_steps: 2
    target_update_interval: 1000
    exploration_fraction: 0.3
    exploration_final_eps: 0.05
    net_arch: [64, 64]
