name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-infra.txt
      - name: Installer torch (CPU) puis les dependances
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Tests rapides
        run: python -m pytest -m "not slow"
      - name: Tests lents (entrainement, processus reels)
        run: python -m pytest -m slow

  deploiement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer le minimum pour le generateur
        run: python -m pip install PyYAML==6.0.3 numpy==2.5.4 fastapi==0.143.1 httpx==0.28.1 prometheus_client==0.26.0
      - name: Generer deploy/
        run: python scripts/gen_compose.py --hosts vm1=10.0.0.1,vm2=10.0.0.2,vm3=10.0.0.3
      - name: Valider les fichiers Compose (docker compose config)
        run: |
          for file in deploy/compose.*.yml; do
            echo "== $file"
            docker compose -f "$file" config --quiet
          done
      - name: Construire l'image du worker
        run: docker build -f docker/Dockerfile.worker -t fogrl-worker:ci .
      - name: Le worker demarre et repond
        run: |
          docker run -d --name worker-ci -p 8001:8001 -e NODE_ID=fogA -e PORT=8001 fogrl-worker:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8001/health; then break; fi
            sleep 1
          done
          curl -fs http://127.0.0.1:8001/state
          docker logs worker-ci
